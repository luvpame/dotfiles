presets:
  common:
    allow:
      # プロジェクト作業ディレクトリ
      - path: "."
        eval-symlinks: true
      # 一時ファイル (macOS: /tmp -> /private/tmp)
      - path: "/tmp"
        eval-symlinks: true
      # ターミナル操作
      - "/dev"
      # npm/npx キャッシュ (MCP サーバー等)
      - "$HOME/.npm"
      # pnpm
      - "$HOME/Library/pnpm"
      # bun キャッシュ (bunx for ccstatusline 等)
      - "$HOME/.bun"
      # 各種キャッシュ
      - path: "$HOME/.cache"
        eval-symlinks: true
      - path: "$HOME/Library/Caches"
        eval-symlinks: true
      # ローカル state/bin (nvim, pnpm, mise 等)
      - "$HOME/.local"
      # Homebrew のインストール先、ログ、信頼設定
      - "/opt/homebrew"
      - "/Applications"
      - "$HOME/Library/Logs/Homebrew"
      - "$HOME/.config/homebrew"
      - "$HOME/.homebrew"
  codex:
    allow:
      - path: "$HOME/.codex"
        eval-symlinks: true
  git:
    allow-keychain: true
    allow-git: true

auto-presets:
  - command: codex
    presets:
      - common
      - codex
      - git
