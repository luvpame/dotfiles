presets:
  common:
    allow:
      # プロジェクト作業ディレクトリ
      - path: "."
        eval-symlinks: true
      # 一時ファイル (macOS: /tmp -> /private/tmp)
      - path: "/tmp"
        eval-symlinks: true
      # ターミナル操作
      - "/dev"
      # npm/npx キャッシュ (MCP サーバー等)
      - "$HOME/.npm"
      # pnpm (lefthook)
      - "$HOME/Library/pnpm/.tools/pnpm/"
      # bun キャッシュ (bunx for ccstatusline 等)
      - "$HOME/.bun"
      # 各種キャッシュ
      - path: "$HOME/.cache"
        eval-symlinks: true
      - path: "$HOME/Library/Caches"
        eval-symlinks: true
      # ローカル state/bin (nvim, pnpm, mise 等)
      - "$HOME/.local"
      # ランタイムで書き込まれるツール設定 (op, gcloud 等)
      - path: "$HOME/.config"
        eval-symlinks: true
      - path: "$HOME/.dotfiles"
        eval-symlinks: true
  codex:
    allow:
      - path: "$HOME/.codex"
        eval-symlinks: true
  git:
    allow-keychain: true
    allow-git: true

auto-presets:
  - command: codex
    presets:
      - common
      - codex
      - git
