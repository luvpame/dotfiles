# Ziggity v0.11.0 のデフォルト設定。
# https://github.com/simoarpe/ziggity/blob/v0.11.0/src/config.zig
# リポジトリ直下の .ziggity.ini は、このグローバル設定を上書きする。

# レイアウトと差分表示

# 左側パネルが画面幅に占める割合。20 から 70 の範囲に制限される。
side_panel_width_percent = 34

# 差分の前後に表示するコンテキスト行数。
diff_context = 3

# コミット件名の文字数を赤く表示し始める上限。0 で無効になる。
commit_summary_limit = 50

# コミット本文に表示する折り返しガイドの列。0 で無効になる。
commit_body_guide = 72

# Conventional Commits の type、scope、破壊的変更記号を色分けする。
highlight_conventional_commits = true

# 変更行のうち、実際に変わった単語を太字で強調する。
highlight_word_diff = true

# 長い差分行を表示幅に合わせて折り返す。false の場合は H と L で横スクロールする。
wrap_diff = false

# フォーカス中のパネル番号を再入力したとき、そのパネル内の次のタブへ移動する。
switch_tabs_with_panel_keys = true

# コミットダイアログを開くときに prepare-commit-msg フックを実行する。
prepare_commit_msg_hook = true

# フォーカス中のサイドパネルを広げ、ほかのパネルを縮める。
expand_focused_side_panel = false

# フォーカス中のサイドパネルを広げるときの重み。1 以上を指定する。
expanded_side_panel_weight = 2

# ステージング画面の分割方式。off、on、auto から選ぶ。
staging_split = auto

# ローカルブランチの並び順。date、recency、alphabetical から選ぶ。
branch_sort_order = date

# 更新とフィードバック

# Git 操作後の結果ダイアログ。on_error、always、never から選ぶ。
result_dialog = on_error

# カスタムコマンドの出力方法。show はダイアログ表示、silent は結果設定に従う。
command_output = show

# 作業ツリーをバックグラウンド更新する間隔（秒）。0 で定期更新を無効にする。
refresh_interval_secs = 10

# git fetch をバックグラウンド実行する間隔（秒）。0 で自動 fetch を無効にする。
fetch_interval_secs = 60

# エディタ

# 空の場合は core.editor、GIT_EDITOR、VISUAL、EDITOR の順で自動検出する。
editor_preset =

# 空の場合はプリセットまたは自動検出したエディタを使う。
editor_command =

# 空の場合はエディタの種類から TUI を中断するか自動判定する。
editor_in_terminal =

# 確認ダイアログ
