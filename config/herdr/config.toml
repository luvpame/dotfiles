onboarding = false
[keys]
prefix = "ctrl+j"

new_tab = "prefix+c"
cycle_pane_next = "prefix+tab"
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"
resize_mode = "prefix+r"

focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

[[keys.command]]
key = "prefix+d"
type = "shell"
command = "pane_ids=$(herdr pane list | jq -r --arg pane_id \"$HERDR_ACTIVE_PANE_ID\" '.result.panes as $panes | ($panes[] | select(.pane_id == $pane_id).tab_id) as $tab_id | $panes[] | select(.tab_id == $tab_id and (.label == \"diff view\" or (.terminal_title // \"\" | contains(\"hunk diff\")))) | .pane_id'); if [ -n \"$pane_ids\" ]; then for pane_id in $pane_ids; do herdr pane close \"$pane_id\"; done; else pane_id=$(herdr pane split \"$HERDR_ACTIVE_PANE_ID\" --direction right --no-focus --ratio 0.66 | jq -r '.result.pane.pane_id') && herdr pane rename \"$pane_id\" \"diff view\" && herdr pane run \"$pane_id\" 'hunk diff'; fi"

[[keys.command]]
key = "prefix+g"
type = "pane"
description = "open ziggity"
command = "ziggity"

[[keys.command]]
key = "prefix+p"
type = "popup"
description = "open git worktree"
command = "fish -c 'source ~/.config/herdr/scripts/worktree-fzf.fish; herdr_worktree_fzf'"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+shift+p"
type = "popup"
description = "choose repo and open git worktree"
command = "fish -c 'source ~/.config/herdr/scripts/worktree-fzf.fish; herdr_worktree_fzf --repo'"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+t"
type = "popup"
description = "open floating terminal"
command = "fish"
width = "80%"
height = "80%"

[theme]
name = "catppuccin-latte"
auto_switch = false

[ui.toast]
delivery = "terminal"

[ui]
show_agent_labels_on_pane_borders = true
sidebar_width = 72
sidebar_max_width = 72
confirm_close = false
hide_tab_bar_when_single_tab = true
tab_bar_position = "bottom"
agent_panel_sort = "priority"

[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "workspace", "tab"],
  [
    "agent",
    { token = "$context", fg = "#1e66f5" },
  ],
  [
    { token = "$git_branch", fg = "#1e66f5" },
    { token = "$git_additions", fg = "#40a02b" },
    { token = "$git_deletions", fg = "#d20f39" },
    { token = "$pr_open", fg = "#40a02b" },
    { token = "$pr_draft", fg = "#9ca0b0" },
    { token = "$pr_merged", fg = "#8839ef" },
    { token = "$pr_closed", fg = "#d20f39" },
  ],
]
codex = [
  ["state_icon", "workspace", "tab"],
  [
    "agent",
    { token = "$context", fg = "#1e66f5" },
  ],
  [
    { token = "$git_branch", fg = "#1e66f5" },
    { token = "$git_additions", fg = "#40a02b" },
    { token = "$git_deletions", fg = "#d20f39" },
    { token = "$pr_open", fg = "#40a02b" },
    { token = "$pr_draft", fg = "#9ca0b0" },
    { token = "$pr_merged", fg = "#8839ef" },
    { token = "$pr_closed", fg = "#d20f39" },
  ],
]

[ui.sidebar.spaces]
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true },
    { token = "$agent_summary", dim = true },
  ],
  [
    { token = "$git_branch", fg = "#1e66f5" },
    { token = "$git_additions", fg = "#40a02b" },
    { token = "$git_deletions", fg = "#d20f39" },
    { token = "$pr_open", fg = "#40a02b" },
    { token = "$pr_draft", fg = "#9ca0b0" },
    { token = "$pr_merged", fg = "#8839ef" },
    { token = "$pr_closed", fg = "#d20f39" },
  ],
  ["$ci_status", "$review_status"],
]

[experimental]
pane_history = true
switch_ascii_input_source_in_prefix = true
