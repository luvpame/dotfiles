onboarding = false
[keys]
prefix = "ctrl+j"
toggle_sidebar = ""
rename_pane = ""

new_tab = "prefix+c"
cycle_pane_next = "prefix+tab"
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"
resize_mode = "prefix+r"

focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

[[keys.command]]
key = "prefix+d"
type = "popup"
description = "hunk diff"
command = "hunk diff"
width = "100%"
height = "100%"

[[keys.command]]
key = "prefix+g"
type = "pane"
description = "open ziggity"
command = "ziggity"

[[keys.command]]
key = "prefix+p"
type = "popup"
description = "PR Review, worktree or root"
command = "fish -c 'source ~/.config/herdr/scripts/worktree-fzf.fish; herdr_worktree_fzf'"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+b"
type = "popup"
description = "switch repository"
command = "fish -c 'ghq_cd_fzf --workspace'"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+t"
type = "popup"
description = "open floating terminal"
command = "fish"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+shift+r"
type = "popup"
description = "PR Review"
command = "python3 ~/.config/herdr/scripts/pr-review.py"
width = "80%"
height = "80%"

[theme]
name = "catppuccin-latte"
auto_switch = false

[ui.toast]
delivery = "terminal"

[ui]
pane_borders = "always"
pane_outer_borders = true
show_agent_labels_on_pane_borders = true
sidebar_width = 72
sidebar_max_width = 72
confirm_close = false
hide_tab_bar_when_single_tab = false
tab_bar_position = "bottom"
tab_bar_right = [
  { type = "zoom" },
  { type = "command", command = "gh api --method GET search/issues -f 'q=is:pr is:open review-requested:@me' -f per_page=1 --jq '\"PR review: \\(.total_count)\"'", interval_seconds = 60, timeout_seconds = 10 },
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = " · "
agent_panel_sort = "spaces"
status_indicators = "symbols"

[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "workspace", "tab"],
  [
    "agent",
    { token = "$context", fg = "#1e66f5" },
  ],
  [
    { token = "$git_branch", fg = "#1e66f5" },
    { token = "$pr_open", fg = "#40a02b" },
    { token = "$pr_draft", fg = "#9ca0b0" },
    { token = "$pr_merged", fg = "#8839ef" },
    { token = "$pr_closed", fg = "#d20f39" },
  ],
]
codex = [
  ["state_icon", "workspace", "tab"],
  [
    "agent",
    { token = "$context", fg = "#1e66f5" },
  ],
  [
    { token = "$git_branch", fg = "#1e66f5" },
    { token = "$pr_open", fg = "#40a02b" },
    { token = "$pr_draft", fg = "#9ca0b0" },
    { token = "$pr_merged", fg = "#8839ef" },
    { token = "$pr_closed", fg = "#d20f39" },
  ],
]

[ui.sidebar.spaces]
rows = [
  [
    "state_icon",
    { token = "$review_space", fg = "#8839ef" },
    "workspace",
    "branch",
    "git_status",
    { token = "$dev_server", fg = "#fe640b" },
  ],
  [
    { token = "$pr_open", fg = "#40a02b" },
    { token = "$pr_draft", fg = "#9ca0b0" },
    { token = "$pr_merged", fg = "#8839ef" },
    { token = "$pr_closed", fg = "#d20f39" },
    { token = "$review_status", fg = "#8839ef", rules = [
      { equals = "✓ approved", fg = "#40a02b" },
      { equals = "× changes", fg = "#d20f39", bold = true },
      { equals = "○ review", fg = "#df8e1d" },
    ] },
  ],
]

[experimental]
pane_history = true
switch_ascii_input_source_in_prefix = true
